name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      # the stack this fork supports
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install sqlalchemy==2.0.54 flask==3.1.3 werkzeug==3.1.8 marshmallow==3.26.2 \
            marshmallow-jsonapi==0.24.0 'pytest==9.*'
          pip install -e .
      - name: Run tests
        run: pytest tests/ -v
